apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-deployment
  labels:
    app: fastchat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastchat-mongodb
      db: mongodb
  template:
    metadata:
      labels:
        app: fastchat-mongodb
        db: mongodb
    spec:
      containers:
      - name: mongodb-container
        image: mongo:7.0
        envFrom:
        - secretRef:
            name: mongodb-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "500m"
