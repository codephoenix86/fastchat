services:
  fastchat:
    image: nareshlohar86/fastchat
    container_name: fastchat
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fastchat
      - shared-gateway
    environment:
      - PORT=${PORT:-3000}
      - NODE_ENV=${NODE_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:mongopassword@mongodb:27017/fastchat?authSource=admin}
      - POSTGRES_URI=${POSTGRES_URI:-postgresql://postgres:postgrespassword@postgres:5432/fastchat}
      - REDIS_URI=${REDIS_URI:-redis://:redispassword@redis:6379}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET:-p9&K#2mZ!vR5*qN8^wX0(bY4@zL7_jT1}
      - ACCESS_TOKEN_TTL=${ACCESS_TOKEN_TTL:-15m}
      - REFRESH_TOKEN_TTL=${REFRESH_TOKEN_TTL:-7d}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-5242880}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
  mongodb:
    image: mongo:7.0
    container_name: my-mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-mongo}
      - MONGO_INITDB_ROOT_PASSWORD=${MONG_PASSWORD:-mongopassword}
    volumes:
     - mongo-data:/data/db
    networks:
      - fastchat
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 30s
      retries: 5
  postgres:
    image: postgres:16-alpine
    container_name: my-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgrespassword}
      - POSTGRES_DB=${POSTGRES_DB:-fastchat}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - fastchat
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fastchat}"]
      interval: 5s
      timeout: 30s
      retries: 5
  redis:
    image: redis:7.2-alpine
    container_name: my-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword}
    volumes:
      - redis-data:/data
    networks:
      - fastchat
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 30s
      retries: 5

networks:
  fastchat:
    external: true
  shared-gateway:
    external: true
  
volumes:
  mongo-data:
  postgres-data:
  redis-data: